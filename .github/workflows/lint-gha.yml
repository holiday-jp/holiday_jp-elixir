---
name: lint github actions

"on":
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  push:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"

jobs:
  gha-lint:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ne-sachirou/lint-gha-reviewdog@v0
        with:
          github_token: ${{ github.token }}
